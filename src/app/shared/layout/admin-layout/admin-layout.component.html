<div id="app-shell">
  <aside class="sidebar">
    <span class="brand"><span class="dot"></span><span class="txt">QA · MVP</span></span>

    <nav>
      <div class="nav-group">Principal</div>
      <button class="nav-item" routerLink="/dashboard" routerLinkActive="active">
        <span class="ic">⊞</span><span class="txt">Dashboard</span>
      </button>

      <div class="nav-group">Gestión</div>
      <button class="nav-item" routerLink="/casos-prueba" routerLinkActive="active">
        <span class="ic">☰</span><span class="txt">Casos de prueba</span>
      </button>
      <button
        class="nav-item"
        routerLink="/priorizacion"
        routerLinkActive="active"
        [class.disabled]="esDesarrollador()"
        [disabled]="esDesarrollador()"
      >
        <span class="ic">⇅</span><span class="txt">Priorización</span>
      </button>

      <div class="nav-group">Reportes</div>
      <button
        class="nav-item"
        routerLink="/reportes"
        routerLinkActive="active"
        [class.disabled]="esDesarrollador()"
        [disabled]="esDesarrollador()"
      >
        <span class="ic">◕</span><span class="txt">Reportes</span>
      </button>

      <div class="nav-group">Administración</div>
      <button
        class="nav-item"
        routerLink="/configuracion-priorizacion"
        routerLinkActive="active"
        [class.disabled]="!esAdmin()"
        [disabled]="!esAdmin()"
      >
        <span class="ic">⚙</span><span class="txt">Criterios de priorización</span>
      </button>
      <button
        class="nav-item"
        routerLink="/usuarios"
        routerLinkActive="active"
        [class.disabled]="!esAdmin()"
        [disabled]="!esAdmin()"
      >
        <span class="ic">◎</span><span class="txt">Usuarios y roles</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar">{{ iniciales }}</div>
        <div class="who">
          <b>{{ usuario?.nombre ?? 'Usuario' }}</b>
          <span>{{ rolFormateado }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
